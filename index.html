<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do-List</title>
    <link rel="stylesheet" href="./src/output.css">
    <!-- <script src="https://cdn.tailwindcss.com"></script> -->


</head>
<body class="bg-amber-200 grid grid-cols-1 place-items-center">
    <div id="card" class="bg-gray-50 w-100 p-10 flex flex-col gap-6 rounded-xs items-center">
        <h1 class="uppercase text-2xl font-bold text-amber-600">To DO LIST</h1>
        <div>
            <input id="input" type="text" placeholder="Enter a Task . . ." class="p-1 border rounded-xs border-b-blue-600">
            <button id="btnadd" class="bg-blue-600 text-white uppercase p-2 rounded-xl">Add</button>
        </div>
        <p class="uppercase " id="counter"></p>
        <div id="list" class="">

        </div>
    </div>
    <script>
        const input=document.getElementById("input");
        const btnadd=document.getElementById("btnadd");
        const list=document.getElementById("list");
        const counter=document.getElementById("counter");
        let tasktable=[];
        function Addtask(){
            texte=input.value.trim();
            tasktable.push(texte);
            input.value='';
            Displaytask();
        }
        function Displaytask(){
            list.innerHTML='';
            for(let i=0; i< tasktable.length; i++){
                const li=document.createElement('li');
                li.textContent=tasktable[i];
                list.appendChild(li);
            }
            counter.innerHTML=`<span class="text-2xl font-bold text-blue-700" id="counter">${tasktable.length}</span> tâche(s)`;
        }
        btnadd.addEventListener('click', Addtask);
        input.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                Addtask();
            }
        });
    </script>
</body>
</html>
